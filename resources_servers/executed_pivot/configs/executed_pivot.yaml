# Executed Pivots: drop-in replacement for terminus_judge_string_only on the Terminal-Pivot rows.
# Production backend: Nebius Sandboxes (contree). For a local run with no sandbox
# token, use configs/executed_pivot_overlay.yaml.
executed_pivot_resources_server:
  resources_servers:
    executed_pivot:
      entrypoint: app.py
      backend: contree
      anchors_path: data/anchors.jsonl
      threshold: 0.75
      min_self_agreement: 1.0
      cmd_timeout: 30
      max_concurrency: 48
      domain: agent
      verified: false
      description: Executed Pivots - next terminal action, rewarded by executing it in a fork of the pivot's rebuilt state
      value: Reward what a command does, not how it is spelled

executed_pivot_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: executed_pivot_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: train
        type: train
        jsonl_fpath: resources_servers/executed_pivot/data/train.jsonl
        num_repeats: 1
        # Rows rebuilt from nvidia/Nemotron-RL-Agentic-Terminal-Pivot-v1 (CC-BY-4.0). Gym requires a license on
        # train/validation datasets and silently drops the whole agent from the config without one.
        license: Creative Commons Attribution 4.0 International
      - name: example
        type: example
        jsonl_fpath: resources_servers/executed_pivot/data/example.jsonl
        num_repeats: 1
